# Builds Nadcord Installer (Windows) and publishes it to the "installer" release.
# The UI is plain HTML/CSS (installer/frontend) rendered with Wails + WebView2;
# the install logic is the Go code from Vencord Installer.

name: Build Installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - installer/**
      - .github/workflows/installer.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: installer/go.sum

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e # v0.3.3

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -o pipefail
          mkdir -p build
          go-winres make
          HASH=$(git rev-parse --short HEAD)
          LDFLAGS="-H windowsgui -s -w -X vencordinstaller/buildinfo.InstallerGitHash=$HASH -X vencordinstaller/buildinfo.InstallerTag=installer"
          if ! (go mod tidy && go build -tags wails,desktop,production -ldflags "$LDFLAGS" -o build/NadcordInstaller.exe .) 2>&1 | tee build.log; then
            # Surface compiler errors as annotations so they are readable from the API
            grep -v "^go: downloading" build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          ls -la build

      - name: Publish release "installer"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view installer >/dev/null 2>&1 || gh release create installer --title "Nadcord Installer" --notes "Download NadcordInstaller.exe, run it, pick your Discord and press Install." --latest=false
          gh release edit installer --title "Nadcord Installer" --notes "Download NadcordInstaller.exe, run it, pick your Discord and press Install." --latest=false
          gh release upload installer --clobber build/NadcordInstaller.exe
