<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nadcord Installer</title>
<style>
  :root {
    --lime: #b8ff1f;
    --lime-deep: #8fd400;
    --moss: #151b0f;
    --moss-raised: #1d2515;
    --moss-line: #2b3620;
    --ink: #0a0d07;
    --text: #f1ffe0;
    --muted: #8e9e7e;
    --danger: #ff5c7a;
    --font: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { height: 100%; }

  body {
    background: #050604;
    color: var(--text);
    font: 15px/1.45 var(--font);
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }

  .app {
    width: 100vw;
    height: 100vh;
    max-width: 920px;
    max-height: 600px;
    display: grid;
    grid-template-columns: 340px 1fr;
    background: var(--moss);
    overflow: hidden;
    position: relative;
  }

  /* ---------- Lime slab ---------- */
  .slab {
    position: relative;
    background: var(--lime);
    color: var(--ink);
    padding: 34px 32px 28px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    --wails-draggable: drag;
  }

  .slab .fill {
    position: absolute;
    inset: auto 0 0 0;
    height: 0%;
    background: var(--ink);
    transition: height .5s cubic-bezier(.6, 0, .2, 1);
    z-index: 0;
  }

  .slab > *:not(.fill) { position: relative; z-index: 1; }

  .wordmark {
    font-size: 96px;
    line-height: .82;
    font-weight: 800;
    letter-spacing: -0.065em;
    margin-left: -6px;
    transition: color .3s;
  }

  .wordmark span { display: block; }

  .tagline {
    margin-top: 18px;
    font-size: 15px;
    font-weight: 600;
    max-width: 22ch;
    transition: color .3s;
  }

  .build {
    margin-top: auto;
    font-size: 13px;
    font-weight: 600;
    display: grid;
    gap: 2px;
    transition: color .3s;
  }

  .build .hash { font-weight: 800; font-size: 15px; }

  .status {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 2px solid currentColor;
    font-size: 14px;
    font-weight: 700;
    min-height: 40px;
    transition: color .3s;
  }

  .app.busy .slab .wordmark,
  .app.busy .slab .tagline,
  .app.busy .slab .build,
  .app.busy .slab .status { color: var(--lime); }

  /* ---------- Right panel ---------- */
  .panel {
    display: flex;
    flex-direction: column;
    padding: 30px 34px 28px;
    min-width: 0;
  }

  .titlebar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin: -18px -22px 6px 0;
    --wails-draggable: drag;
  }

  .win-btn {
    --wails-draggable: no-drag;
    width: 34px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }

  .win-btn:hover { background: var(--moss-raised); color: var(--text); }
  .win-btn.close:hover { background: var(--danger); color: var(--ink); }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .hint { color: var(--muted); margin-top: 4px; font-size: 14px; }

  .installs {
    list-style: none;
    padding: 0;
    margin-top: 22px;
    display: grid;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
    align-content: start;
    scrollbar-width: thin;
    scrollbar-color: var(--moss-line) transparent;
  }

  .install {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--moss-line);
    border-radius: 14px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }

  .install:hover { background: var(--moss-raised); }

  .install[aria-checked="true"] {
    border-color: var(--lime);
    background: var(--moss-raised);
  }

  .install:focus-visible, .btn:focus-visible, .win-btn:focus-visible, .link:focus-visible {
    outline: 2px solid var(--lime);
    outline-offset: 3px;
  }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    display: grid;
    place-items: center;
  }

  .install[aria-checked="true"] .dot { border-color: var(--lime); }
  .install[aria-checked="true"] .dot::after {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--lime);
  }

  .install .name { font-size: 17px; font-weight: 700; }
  .install .path {
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--lime);
    color: var(--ink);
    white-space: nowrap;
  }

  .badge.off {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--moss-line);
  }

  .install.other .name { font-weight: 600; color: var(--muted); }
  .install.other[aria-checked="true"] .name { color: var(--text); }

  .empty {
    padding: 22px;
    border: 2px dashed var(--moss-line);
    border-radius: 14px;
    color: var(--muted);
  }

  .empty strong { color: var(--text); display: block; margin-bottom: 4px; }

  /* ---------- Actions ---------- */
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
    align-items: stretch;
  }

  .btn {
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 20px;
    cursor: pointer;
    transition: transform .08s, background .15s, color .15s, opacity .15s;
  }

  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

  .btn.primary {
    flex: 1;
    background: var(--lime);
    color: var(--ink);
    font-size: 17px;
  }

  .btn.primary:hover:not(:disabled) { background: #cbff5c; }

  .btn.secondary {
    background: var(--moss-raised);
    color: var(--text);
    border: 2px solid var(--moss-line);
  }

  .btn.secondary:hover:not(:disabled) { border-color: var(--lime); }

  .btn.danger {
    background: transparent;
    color: var(--danger);
    border: 2px solid transparent;
  }

  .btn.danger:hover:not(:disabled) { border-color: var(--danger); }

  .footer {
    margin-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
    gap: 12px;
  }

  .link {
    color: var(--muted);
    background: none;
    border: 0;
    font: inherit;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .link:hover { color: var(--lime); }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute;
    left: 374px;
    right: 34px;
    bottom: 118px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--moss-raised);
    border: 2px solid var(--moss-line);
    font-size: 14px;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }

  .toast.show { opacity: 1; transform: none; pointer-events: auto; }
  .toast.error { border-color: var(--danger); }
  .toast.error strong { color: var(--danger); }
  .toast strong { display: block; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="slab" aria-live="polite">
    <div class="fill" id="fill"></div>
    <div class="wordmark" aria-label="Nadcord"><span>nad</span><span>cord</span></div>
    <p class="tagline">Your Discord, with every Vencord plugin and a few of our own.</p>
    <div class="build">
      <span>Latest build</span>
      <span class="hash" id="hash">checking GitHub…</span>
    </div>
    <p class="status" id="status">Pick an install and press Install. Discord closes by itself.</p>
  </aside>

  <main class="panel">
    <div class="titlebar">
      <button class="win-btn" id="minimize" aria-label="Minimize">–</button>
      <button class="win-btn close" id="close" aria-label="Close">✕</button>
    </div>

    <h1>Where should Nadcord go?</h1>
    <p class="hint">We found these Discord installs on this PC.</p>

    <ul class="installs" id="installs" role="radiogroup" aria-label="Discord installs"></ul>

    <div class="actions">
      <button class="btn primary" id="install">Install Nadcord</button>
      <button class="btn secondary" id="repair">Repair</button>
      <button class="btn danger" id="uninstall">Uninstall</button>
    </div>

    <div class="footer">
      <span>Only download Nadcord from github.com/nad76768/nadcord</span>
      <button class="link" id="openasar">OpenAsar</button>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </main>
</div>

<script>
  // ---- Backend bridge: the real app (Wails) exposes window.go.main.App.
  // In a normal browser we fall back to a mock so the UI can be previewed.
  const runtime = () => window.runtime;

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const mockState = {
    latestHash: "5b5d807",
    githubError: "",
    discords: [
      { path: "C:\\Users\\mrnad\\AppData\\Local\\Discord", branch: "stable", isPatched: false, isOpenAsar: false },
      { path: "C:\\Users\\mrnad\\AppData\\Local\\DiscordCanary", branch: "canary", isPatched: true, isOpenAsar: false }
    ]
  };
  const mock = {
    GetState: async () => (await wait(400), structuredClone(mockState)),
    Install: async p => { await wait(1600); mockState.discords.find(d => d.path === p).isPatched = true; },
    Repair: async p => { await wait(1600); mockState.discords.find(d => d.path === p).isPatched = true; },
    Uninstall: async p => { await wait(900); mockState.discords.find(d => d.path === p).isPatched = false; },
    ToggleOpenAsar: async () => { await wait(900); },
    PickFolder: async () => null,
    OpenURL: async u => window.open(u, "_blank")
  };
  let api = mock;

  // Wails injects its bridge before our script runs, but give it a moment just in case.
  async function connect() {
    for (let i = 0; i < 40; i++) {
      const app = window.go && window.go.main && window.go.main.App;
      if (app) { api = app; return; }
      if (!window.wails && i > 4) return; // plain browser: keep the preview mock
      await wait(50);
    }
  }

  const BRANCH_NAMES = { stable: "Discord", canary: "Discord Canary", ptb: "Discord PTB", development: "Discord Development" };

  const $ = id => document.getElementById(id);
  let state = { discords: [] };
  let selected = null;
  let busy = false;

  function setStatus(text) { $("status").textContent = text; }

  let toastTimer;
  function toast(title, body, isError = false) {
    const t = $("toast");
    t.className = "toast show" + (isError ? " error" : "");
    t.innerHTML = "";
    const s = document.createElement("strong");
    s.textContent = title;
    t.append(s, document.createTextNode(body));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 9000 : 5000);
  }

  function render() {
    const list = $("installs");
    list.innerHTML = "";

    if (!state.discords.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.innerHTML = "<strong>No Discord found</strong>Install Discord first, or choose its folder yourself below.";
      list.append(li);
    }

    for (const d of state.discords) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "install";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(selected === d.path));
      b.innerHTML = `
        <span class="dot"></span>
        <span><span class="name"></span><span class="path" style="display:block"></span></span>
        <span class="badge ${d.isPatched ? "" : "off"}">${d.isPatched ? "Nadcord installed" : "Not installed"}</span>`;
      b.querySelector(".name").textContent = BRANCH_NAMES[d.branch] || "Discord";
      b.querySelector(".path").textContent = d.path;
      b.onclick = () => { selected = d.path; render(); };
      li.append(b);
      list.append(li);
    }

    const other = document.createElement("li");
    const ob = document.createElement("button");
    ob.className = "install other";
    ob.innerHTML = `<span class="dot"></span><span class="name">Another folder…</span><span></span>`;
    ob.onclick = pickFolder;
    other.append(ob);
    list.append(other);

    const cur = current();
    const ready = !!cur && !busy && !state.githubError && !state.filesDirError;
    $("install").disabled = !ready;
    $("repair").disabled = !ready || !cur.isPatched;
    $("uninstall").disabled = !cur || busy || !cur.isPatched;
    $("openasar").textContent = cur && cur.isOpenAsar ? "Remove OpenAsar" : "OpenAsar";
    $("install").textContent = cur && cur.isPatched ? "Reinstall Nadcord" : "Install Nadcord";
  }

  function current() { return state.discords.find(d => d.path === selected); }

  async function refresh() {
    try {
      state = await api.GetState();
    } catch (e) {
      toast("Couldn't read your Discord installs", String(e), true);
      return;
    }
    $("hash").textContent = state.githubError ? "unavailable" : state.latestHash;
    if (state.githubError) {
      setStatus("GitHub can't be reached. Check your connection and reopen the installer.");
    } else if (state.filesDirError) {
      setStatus("Nadcord can't create its folder in AppData. Try running the installer as administrator.");
    }
    if (!current() && state.discords.length) selected = state.discords[0].path;
    render();
  }

  async function pickFolder() {
    if (busy) return;
    let d;
    try {
      d = await api.PickFolder();
    } catch (e) {
      toast("That folder can't be used", " " + String(e), true);
      return;
    }
    if (!d) return;
    if (!state.discords.some(x => x.path === d.path)) state.discords.push(d);
    selected = d.path;
    render();
  }

  async function run(action, verbing, done) {
    const cur = current();
    if (!cur || busy) return;
    busy = true;
    $("app").classList.add("busy");
    $("fill").style.height = "100%";
    setStatus(`${verbing}…`);
    render();
    try {
      await api[action](cur.path);
      setStatus(done);
      toast(done, " Open Discord to see the change.");
    } catch (e) {
      setStatus("Something went wrong. Details are in the message on the right.");
      toast(`${verbing} failed`, " " + String(e), true);
    } finally {
      busy = false;
      $("fill").style.height = "0%";
      $("app").classList.remove("busy");
      await refresh();
    }
  }

  $("install").onclick = () => run("Install", "Installing Nadcord", "Nadcord installed.");
  $("repair").onclick = () => run("Repair", "Repairing Nadcord", "Nadcord repaired.");
  $("uninstall").onclick = () => run("Uninstall", "Uninstalling Nadcord", "Nadcord uninstalled.");
  $("openasar").onclick = () => run("ToggleOpenAsar", "Updating OpenAsar", "OpenAsar updated.");
  $("minimize").onclick = () => runtime() && runtime().WindowMinimise();
  $("close").onclick = () => runtime() ? runtime().Quit() : window.close();

  // keyboard: arrows move the selection
  document.addEventListener("keydown", e => {
    if (!["ArrowUp", "ArrowDown"].includes(e.key) || !state.discords.length) return;
    const i = state.discords.findIndex(d => d.path === selected);
    const n = e.key === "ArrowDown" ? Math.min(i + 1, state.discords.length - 1) : Math.max(i - 1, 0);
    selected = state.discords[n].path;
    render();
    e.preventDefault();
  });

  connect().then(refresh);
</script>
</body>
</html>
